name: Backend CI and Container

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
    tags:
      - 'v*.*.*'

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  BACKEND_DIR: backend

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Validate Prisma schema
      #   run: npm run prisma:validate

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Audit production dependency tree
        run: npm audit --omit=dev --omit=optional --audit-level=high

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: |
          test -n "$GHCR_USERNAME"
          echo "IMAGE_NAME=ghcr.io/${GHCR_USERNAME,,}/student-dating-backend" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Prepare lowercase image name
        id: meta
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ vars.GHCR_USERNAME }}/dating-app-backend" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: mode=max

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
